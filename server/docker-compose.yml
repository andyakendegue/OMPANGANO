# OMPANGANO — pile serveur : PostgreSQL + Garage (S3) + API. Le HTTPS est assuré par le Caddy déjà installé sur le VPS (voir Caddyfile.snippet).
# Local : docker compose up -d --build   (API sur http://localhost:3000)
# VPS   : voir README.md
name: ompangano

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ompangano
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ompangano
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ompangano"]
      interval: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?définir GARAGE_RPC_SECRET dans .env}
    ports:
      - "${BIND_IP:-127.0.0.1}:3900:3900"   # S3 : le Caddy du VPS y redirige le domaine des fichiers
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

  api:
    build:
      context: ..            # racine du dépôt : l'API importe shared/ et src/types
      dockerfile: server/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      garage: { condition: service_started }
    environment:
      PORT: 3000
      DATABASE_URL: postgres://ompangano:${POSTGRES_PASSWORD}@postgres:5432/ompangano
      CORS_ORIGINS: ${CORS_ORIGINS:-https://ompangano.web.app,https://ompangano.firebaseapp.com,https://source.essaka.engineering,http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
      S3_ENDPOINT: http://garage:3900
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:3900}
      S3_REGION: garage
      S3_BUCKET: ${S3_BUCKET:-ompangano}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?créer la clé Garage (scripts/init-garage.sh) puis la noter dans .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?idem}
      # Nkala : interrupteurs, session SMS, services à connecter à la fin (tous facultatifs sauf SESSION_SECRET en production)
      MODULES_ACTIFS: ${MODULES_ACTIFS:-ompangano,onenji,azeva,ontci,nkala}
      FONCTIONS_ACTIVES: ${FONCTIONS_ACTIVES:-}
      SESSION_SECRET: ${SESSION_SECRET:?générer avec openssl rand -hex 32 puis noter dans .env}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SID: ${TWILIO_VERIFY_SID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      IA_MODELE: ${IA_MODELE:-claude-haiku-5-5}
      REVIVE_URL: ${REVIVE_URL:-}
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      SMS_FOURNISSEUR: ${SMS_FOURNISSEUR:-}
      ADMIN_TELEPHONES: ${ADMIN_TELEPHONES:-}
      IA_FOURNISSEUR: ${IA_FOURNISSEUR:-}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      RUNPOD_LLM_ENDPOINT: ${RUNPOD_LLM_ENDPOINT:-}
      RUNPOD_LLM_URL: ${RUNPOD_LLM_URL:-}
      RUNPOD_EMBED_ENDPOINT: ${RUNPOD_EMBED_ENDPOINT:-}
      RUNPOD_EMBED_URL: ${RUNPOD_EMBED_URL:-}
      EMBEDDING_FOURNISSEUR: ${EMBEDDING_FOURNISSEUR:-}
      EMBEDDING_MODELE: ${EMBEDDING_MODELE:-BAAI/bge-m3}
      IA_BASE_URL: ${IA_BASE_URL:-}
      IA_API_KEY: ${IA_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      REVIVE_USER: ${REVIVE_USER:-}
      REVIVE_PASSWORD: ${REVIVE_PASSWORD:-}
      PUSH_FOURNISSEUR: ${PUSH_FOURNISSEUR:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      ACHATS_FOURNISSEUR: ${ACHATS_FOURNISSEUR:-}
      APPLE_ISSUER_ID: ${APPLE_ISSUER_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      MOBILEMONEY_FOURNISSEUR: ${MOBILEMONEY_FOURNISSEUR:-manuel}
      MOBILEMONEY_NUMERO_AIRTEL: ${MOBILEMONEY_NUMERO_AIRTEL:-}
      MOBILEMONEY_NUMERO_MOOV: ${MOBILEMONEY_NUMERO_MOOV:-}
      MOBILEMONEY_API_URL: ${MOBILEMONEY_API_URL:-}
      MOBILEMONEY_API_KEY: ${MOBILEMONEY_API_KEY:-}
      MOBILEMONEY_WEBHOOK_SECRET: ${MOBILEMONEY_WEBHOOK_SECRET:-}
      VECTOR_URL: ${VECTOR_URL:-}
      VECTOR_API_KEY: ${VECTOR_API_KEY:-}
      VECTOR_COLLECTION: ${VECTOR_COLLECTION:-nkala_rag}
      EMBEDDINGS_DIR: /data/embeddings
      AZURACAST_URL: ${AZURACAST_URL:-}
      AZURACAST_API_URL: ${AZURACAST_API_URL:-}
      AZURACAST_API_KEY: ${AZURACAST_API_KEY:-}
    volumes:
      - ${EMBEDDINGS_HOTE:-./embeddings}:/data/embeddings:ro   # sur le VPS : /opt/embeddings
    ports:
      - "${BIND_IP:-127.0.0.1}:3001:3000"   # 3000 est pris par le serveur de dev du site ; sur le VPS BIND_IP=172.17.0.1 (passerelle Docker jointe par le Caddy)

volumes:
  pgdata:
  garage_meta:
  garage_data:
