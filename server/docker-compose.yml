# OMPANGANO — pile serveur : PostgreSQL + Garage (S3) + API + Caddy (HTTPS).
# Local : docker compose up -d --build   (API sur http://localhost:3000)
# VPS   : voir README.md (domaines dans .env)
name: ompangano

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ompangano
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ompangano
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ompangano"]
      interval: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?définir GARAGE_RPC_SECRET dans .env}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

  api:
    build:
      context: ..            # racine du dépôt : l'API importe shared/ et src/types
      dockerfile: server/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      garage: { condition: service_started }
    environment:
      PORT: 3000
      DATABASE_URL: postgres://ompangano:${POSTGRES_PASSWORD}@postgres:5432/ompangano
      CORS_ORIGINS: ${CORS_ORIGINS:-https://ompangano.web.app,http://localhost:3000,http://localhost:5173}
      S3_ENDPOINT: http://garage:3900
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:3900}
      S3_REGION: garage
      S3_BUCKET: ${S3_BUCKET:-ompangano}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?créer la clé Garage (scripts/init-garage.sh) puis la noter dans .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?idem}
    ports:
      - "127.0.0.1:3001:3000"   # en local (3000 est pris par le serveur de dev du site) ; en production seul Caddy est exposé
      - "127.0.0.1:3900:3900"   # S3 (URL présignées en développement)

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["prod"]          # docker compose --profile prod up -d
    depends_on: [api, garage]
    environment:
      API_DOMAIN: ${API_DOMAIN:?ex. api.essaka.engineering}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:?ex. media.essaka.engineering}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  garage_meta:
  garage_data:
  caddy_data:
  caddy_config:
