# Moteur de recherche web hébergé chez nous (SearXNG, AGPL-3.0), sans clé ni abonnement : Kak'Igonjo s'en sert pour les questions
# d'actualité ou de culture générale (jamais pour un mot myènè). Déployé dans /opt/searxng par la veille quand server/searxng/ change.
# N'écoute que sur la passerelle Docker interne (172.17.0.1:8710) : jamais exposé sur Internet.
# Secret : SEARXNG_SECRET dans /opt/searxng/.env (créé sur le serveur, jamais dans le dépôt) : openssl rand -hex 32
services:
  searxng:
    image: searxng/searxng:2026.10.30-ffa88e3ba
    container_name: searxng
    ports:
      - "172.17.0.1:8710:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?créer /opt/searxng/.env avec SEARXNG_SECRET}
      SEARXNG_BASE_URL: http://172.17.0.1:8710/
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped
