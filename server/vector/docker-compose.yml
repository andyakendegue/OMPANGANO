# Base vectorielle Qdrant pour le RAG (facultative). Interne au serveur : jamais exposée sur Internet.
#   cd /opt/vector && docker compose up -d   puis dans server/.env : VECTOR_URL=http://172.17.0.1:6333
#   Après avoir branché Qdrant, réindexer les documents depuis la console (Assistant IA > Réindexer).
name: vector
services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    restart: unless-stopped
    ports: ["172.17.0.1:6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
    environment:
      # Tenir dans ~6 Go : segments sur disque (mmap) au lieu de tout charger en RAM ; charges utiles sur disque.
      # La quantification int8 (copie compacte en RAM) est réglée par l'API à la création de la collection (server/api/src/vecteurs.ts).
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
volumes: { qdrant_data: {} }
